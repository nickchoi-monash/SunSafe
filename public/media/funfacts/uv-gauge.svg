<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="UV gauge background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1320"/>
      <stop offset="0.6" stop-color="#0b4aa2"/>
      <stop offset="1" stop-color="#ff8001"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="35%" r="45%">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ff8a1e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="520" cy="320" r="420" fill="url(#glow)" filter="url(#soft)"/>

  <g transform="translate(800 520)">
    <path d="M-460 0 A460 460 0 0 1 460 0" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="40" stroke-linecap="round"/>
    <path d="M-460 0 A460 460 0 0 1 -200 -410" fill="none" stroke="#2dd4bf" stroke-width="40" stroke-linecap="round"/>
    <path d="M-200 -410 A460 460 0 0 1 140 -440" fill="none" stroke="#ffd166" stroke-width="40" stroke-linecap="round"/>
    <path d="M140 -440 A460 460 0 0 1 420 -180" fill="none" stroke="#ff8a1e" stroke-width="40" stroke-linecap="round"/>
    <path d="M420 -180 A460 460 0 0 1 460 0" fill="none" stroke="#ff4d8d" stroke-width="40" stroke-linecap="round"/>

    <circle cx="0" cy="0" r="20" fill="rgba(255,255,255,0.85)"/>
    <path d="M0 0 L260 -240" stroke="rgba(255,255,255,0.85)" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>

