<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Healthcare cross background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b4aa2"/>
      <stop offset="0.55" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="pulse" cx="60%" cy="40%" r="45%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="980" cy="360" r="420" fill="url(#pulse)" filter="url(#soft)"/>

  <g transform="translate(800 480)">
    <rect x="-190" y="-190" width="380" height="380" rx="44" fill="rgba(255,255,255,0.16)"/>
    <rect x="-60" y="-140" width="120" height="280" rx="22" fill="rgba(255,255,255,0.85)"/>
    <rect x="-140" y="-60" width="280" height="120" rx="22" fill="rgba(255,255,255,0.85)"/>
  </g>
</svg>

